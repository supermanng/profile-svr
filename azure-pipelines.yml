# ProfileSvr — .NET 9 build, test & publish
# Restores, builds, runs the xUnit unit + integration tests, then publishes the API as a 'drop' artifact.

trigger:
  - main

pr:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  publishProject: '**/ProfileSvr.Api.csproj'   # glob — change the filename to your host project's csproj

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 9 SDK'
    inputs:
      packageType: 'sdk'
      version: '9.0.x'

  # Temporary — shows every csproj path in the repo so you can confirm publishProject. Remove once it's right.
  - script: dir /s /b *.csproj
    displayName: 'List projects (temporary)'

  - task: DotNetCoreCLI@2
    displayName: 'Restore'
    inputs:
      command: 'restore'
      projects: 'ProfileSvr.sln'

  - task: DotNetCoreCLI@2
    displayName: 'Build'
    inputs:
      command: 'build'
      projects: 'ProfileSvr.sln'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Test'
    inputs:
      command: 'test'
      projects: 'tests/**/*.Tests.csproj'
      arguments: '--configuration $(buildConfiguration) --no-build --logger trx'
      publishTestResults: true

  - task: DotNetCoreCLI@2
    displayName: 'Publish'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: '$(publishProject)'
      arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)'
      zipAfterPublish: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'